services:
  - type: web
    name: nxt-lvl-api2
    runtime: node
    buildCommand: npm ci && npm run build && npm run prisma:deploy:clientflow
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: CLIENTFLOW_DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_SEND_ENABLED
        value: "true"
      - key: EMAIL_REPLY_TO
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
